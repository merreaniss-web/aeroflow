const distanceNm=(a,b)=>{const r=3440.065,rad=x=>x*Math.PI/180;const dLat=rad(b.lat-a.lat),dLon=rad(b.lon-a.lon);const q=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;return 2*r*Math.asin(Math.min(1,Math.sqrt(q)));};
const bearing=(a,b)=>{const r=x=>x*Math.PI/180,d=x=>x*180/Math.PI;const y=Math.sin(r(b.lon-a.lon))*Math.cos(r(b.lat));const x=Math.cos(r(a.lat))*Math.sin(r(b.lat))-Math.sin(r(a.lat))*Math.cos(r(b.lat))*Math.cos(r(b.lon-a.lon));return (d(Math.atan2(y,x))+360)%360;};

let state=defaultState(), currentView='overview', airportRows=[], runwaysRows=[], freqRows=[], airportLoaded=false, runwaysLoaded=false, mapInstance=null, routeLine=null, waypointLayer=null, airportLayer=null, aircraftMarker=null, mapClickMode=false, gpsWatchId=null, trackingTimer=null, trackingMarker=null, activePdfUrl=null, airportSearchResults=[], currentAirport=null, weatherTimer=null;
function loadState(){const raw=readJSON(localStorage.getItem('flightdeck_state_v2'),null);if(raw&&typeof raw==='object'){state={...defaultState(),...raw,settings:{...defaultState().settings,...raw.settings},aircraft:Array.isArray(raw.aircraft)&&raw.aircraft.length?raw.aircraft:defaultAircraft(),flights:Array.isArray(raw.flights)?raw.flights:[],checklists:raw.checklists||defaultState().checklists,checklistProgress:raw.checklistProgress||{},documents:Array.isArray(raw.documents)?raw.documents:[],savedLinks:Array.isArray(raw.savedLinks)?raw.savedLinks:[]};}}
let saveTimer=null;
function saveState(silent=true){try{state.version=VERSION;localStorage.setItem('flightdeck_state_v2',JSON.stringify(state));if(!silent)toast('Modifications enregistrées.','success');}catch(e){toast('Enregistrement impossible : stockage navigateur saturé. Exportez une sauvegarde.','error');}}
function scheduleSave(){if(!state.settings.autoSave)return;clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveState(true),220);}
function flight(){let f=state.flights.find(x=>x.id===state.activeFlightId);if(!f){f=defaultFlight();state.flights.unshift(f);state.activeFlightId=f.id;saveState(true)}return f;}
function aircraft(){return state.aircraft.find(a=>a.id===flight().aircraftId)||state.aircraft[0]||defaultAircraft()[0];}
function touchFlight(){const f=flight();f.updatedAt=nowISO();f.name=`${f.origin||'----'} → ${f.destination||'----'} · ${f.flightNo||f.callsign||'Vol'}`;scheduleSave();}
function airportDB(){return indexedDB.open(DB_NAME,DB_VERSION)}
function withDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(new Error('IndexedDB indisponible'));return;}const req=airportDB();req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});}
async function idbGet(key){try{const db=await withDB();return await new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readonly').objectStore(STORE).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}catch{return null}}
async function idbPut(key,value){const db=await withDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(value,key);tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error);});}
async function idbDelete(key){try{const db=await withDB();return await new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(key);r.onsuccess=()=>resolve(true);r.onerror=()=>reject(r.error)});}catch{return false}}
async function fetchTextCached(key,url,force=false){const cached=force?null:await idbGet(key);if(cached&&cached.text&&Date.now()-cached.time<7*86400000)return cached.text;const res=await fetch(url,{mode:'cors',cache:'default'});if(!res.ok)throw new Error(`Source indisponible (${res.status})`);const text=await res.text();try{await idbPut(key,{text,time:Date.now()})}catch{}return text;}
function parseCSV(text){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c;}else if(c==='"')quoted=true;else if(c===','){row.push(field);field=''}else if(c==='\n'){row.push(field.replace(/\r$/,''));if(row.some(x=>x!==''))rows.push(row);row=[];field=''}else field+=c;}if(field!==''||row.length){row.push(field);rows.push(row)}if(!rows.length)return[];const headers=rows.shift();return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??''])))}
async function ensureAirports(force=false){if(airportLoaded&&!force)return airportRows;setConnection('Chargement des aéroports…');try{const txt=await fetchTextCached('airports_csv',AIRPORTS_URL,force);airportRows=parseCSV(txt).filter(a=>a.ident&&a.latitude_deg&&a.longitude_deg&&a.type!=='closed');airportLoaded=true;state.settings.airportLoadedAt=nowISO();saveState(true);setConnection('Aéroports chargés');return airportRows;}catch(e){setConnection('Aéroports hors ligne');throw e}}
async function ensureRunways(){if(runwaysLoaded)return runwaysRows;const txt=await fetchTextCached('runways_csv',RUNWAYS_URL);runwaysRows=parseCSV(txt);runwaysLoaded=true;return runwaysRows}
async function ensureFrequencies(){if(freqRows.length)return freqRows;const txt=await fetchTextCached('freq_csv',FREQ_URL);freqRows=parseCSV(txt);return freqRows}
function setConnection(text){const el=$('#connectionLabel');if(el)el.textContent=text;}
function pointForAirport(code){const key=String(code||'').toUpperCase().trim();let a=airportRows.find(a=>a.ident.toUpperCase()===key);if(!a)a=airportRows.find(a=>String(a.gps_code||'').toUpperCase()===key);if(!a)a=airportRows.find(a=>String(a.local_code||'').toUpperCase()===key);if(!a)return null;return {lat:num(a.latitude_deg),lon:num(a.longitude_deg),ident:a.ident,name:a.name,elevation:num(a.elevation_ft),type:a.type,iso_country:a.iso_country,municipality:a.municipality};}
function airportName(code){const p=pointForAirport(code);return p?.name||''}
function routeCoordinates(f=flight()){const points=[];const o=pointForAirport(f.origin);if(o)points.push({...o,kind:'departure'});(f.routePoints||[]).forEach((p,i)=>{if(Number.isFinite(Number(p.lat))&&Number.isFinite(Number(p.lon)))points.push({lat:Number(p.lat),lon:Number(p.lon),ident:p.ident||`WPT${i+1}`,name:p.name||p.ident||`Point ${i+1}`,kind:'waypoint'});});const d=pointForAirport(f.destination);if(d)points.push({...d,kind:'destination'});return points;}
function calculations(f=flight()){const ac=state.aircraft.find(a=>a.id===f.aircraftId)||state.aircraft[0]||defaultAircraft()[0];const pts=routeCoordinates(f);let dist=0,legs=[];for(let i=1;i<pts.length;i++){const nm=distanceNm(pts[i-1],pts[i]);const brg=bearing(pts[i-1],pts[i]);dist+=nm;legs.push({from:pts[i-1].ident,to:pts[i].ident,distance:nm,bearing:brg});}const speed=Math.max(30,num(f.cruiseKt,num(ac.cruiseKt,450))+num(f.windKt));const estimatedMin=dist>0?dist/speed*60:0;const tripFuel=f.tripFuelOverrideKg!==''?Math.max(0,num(f.tripFuelOverrideKg)):Math.max(0,estimatedMin/60*num(ac.burnKgHr));const taxiFuel=Math.max(0,num(f.taxiFuelKg));const cont=Math.max(0,tripFuel*num(f.contingencyPct,5)/100);const alt=Math.max(0,num(f.alternateFuelKg));const reserve=Math.max(0,num(f.finalReserveMin))/60*Math.max(0,num(ac.burnKgHr));const extra=Math.max(0,num(f.extraFuelKg));const block=f.blockFuelOverrideKg!==''?Math.max(0,num(f.blockFuelOverrideKg)):taxiFuel+tripFuel+cont+alt+reserve+extra;const pax=Math.max(0,num(f.pax));const payload=pax*84+Math.max(0,num(f.cargoKg))+Math.max(0,num(f.baggageKg));const zfw=num(ac.emptyKg)+payload;const tow=zfw+Math.max(0,block-taxiFuel);const landing=tow-tripFuel;const checks=[];if(!pointForAirport(f.origin))checks.push({level:'bad',title:'Départ non résolu',text:'Sélectionnez un aéroport reconnu dans la base.'});if(!pointForAirport(f.destination))checks.push({level:'bad',title:'Destination non résolue',text:'Sélectionnez un aéroport reconnu dans la base.'});if(f.origin&&f.destination&&f.origin===f.destination)checks.push({level:'bad',title:'Départ et destination identiques',text:'Choisissez deux aéroports différents.'});if(!f.route.trim())checks.push({level:'warn',title:'Route non renseignée',text:'Saisissez une route ou ajoutez des points sur la carte.'});if(!f.sid||!f.star||!f.approach)checks.push({level:'warn',title:'Procédures à compléter',text:'Renseignez les SID, STAR et procédure d’approche retenues.'});if(num(f.maxFuelKg??ac.fuelCapacityKg,ac.fuelCapacityKg)>0&&block>num(ac.fuelCapacityKg))checks.push({level:'warn',title:'Carburant au-dessus de la capacité du profil',text:'Vérifiez la capacité indiquée dans le profil appareil.'});if(zfw>num(ac.maxZfwKg))checks.push({level:'bad',title:'ZFW au-dessus de la limite configurée',text:'Vérifiez charge utile et profil appareil.'});if(tow>num(ac.maxTowKg))checks.push({level:'bad',title:'TOW au-dessus de la limite configurée',text:'Vérifiez le profil de masse et le carburant.'});if(landing>num(ac.maxLdwKg))checks.push({level:'bad',title:'Masse estimée à l’atterrissage élevée',text:'Vérifiez les paramètres et la limite configurée.'});if(!f.departureMetar||!f.destinationMetar)checks.push({level:'warn',title:'Observations météo non saisies',text:'La prévision de modèle ne remplace pas le METAR/TAF.'});if(!f.notams.trim())checks.push({level:'warn',title:'NOTAM non reportés',text:'Ajoutez les informations pertinentes issues du briefing officiel.'});return {ac,points:pts,legs,distanceNm:dist,estimatedMin,tripFuel,taxiFuel,cont,alt,reserve,extra,block,payload,zfw,tow,landing,checks,groundSpeed:speed};}

function renderOverview(){const f=flight(),x=calculations(f),o=pointForAirport(f.origin),d=pointForAirport(f.destination);const saved=state.flights.filter(t=>t.id!==f.id).slice(0,5);return `${pageHead('Vue générale','Synthèse opérationnelle · suivi de la préparation',`${actionButton('＋ Nouveau vol','new-flight','btn primary')}${actionButton('Générer l’OFP','go-ofp','btn')}`)}<div class="flight-strip"><div><div class="strip-kicker">Vol actif · ${esc(f.status||'Draft')}</div><div class="strip-name">${esc(f.callsign||f.flightNo||'FDK001')}</div><div class="tiny" style="color:#aebfc8;margin-top:6px">${esc(x.ac?.name||'Aucun appareil sélectionné')} · ${esc(f.rules||'IFR')}</div></div><div class="strip-route"><div class="airport-big"><strong>${esc(f.origin||'----')}</strong><small>${esc(o?.municipality||o?.name||'Départ à définir')}</small></div><div class="route-line"></div><div class="airport-big"><strong>${esc(f.destination||'----')}</strong><small>${esc(d?.municipality||d?.name||'Destination à définir')}</small></div></div><div class="strip-info">Heure prévue de départ<strong>${f.date?new Date(f.date).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'À définir'}</strong><span class="mono">${esc(f.flightNo||f.callsign||'—')}</span></div></div><div class="grid cols-4" style="margin-bottom:15px">${stat('Distance estimée',`${fmt(x.distanceNm)} NM`,'Selon les points cartographiques disponibles')}${stat('Temps de croisière estimé',`${fmt(x.estimatedMin/60,1)} h`,'Distance / vitesse renseignée')}${stat('Carburant bloc estimé',`${fmt(x.block)} kg`,'Hypothèses configurées dans le profil')}${stat('Préparation',`${Math.max(0,100-Math.min(100,x.checks.length*8))}%`,'Indicateur de complétude uniquement')}</div><div class="grid cols-2" style="align-items:start"><div class="grid" style="gap:15px">${card('Points à vérifier',x.checks.length?`<div style="display:grid;gap:9px">${x.checks.slice(0,6).map(z=>`<div class="row" style="align-items:flex-sta iv class="actions">${actionButton('Nouvelle fiche de vol','new-flight','btn')}${actionButton('Enregistrer maintenant','save-now','btn')}${actionButton('Générer le dossier OFP','view:ofp','btn primary')}</div></div></div></section><div class="notice warn">Les calculs de cette application sont des estimations transparentes basées sur les champs de profil et les points cartographiques connus. Ils ne constituent pas un calcul de performances certifié. Vérifiez les procédures, NOTAM, météo, masses/centrages et carburant dans les sources propres à votre appareil et à votre environnement.</div></div>`}

function renderRoutePoints(){const pts=routeCoordinates();const w=flight().routePoints||[];if(!pts.length)return '<div class="empty">Sélectionnez un départ et une destination reconnus dans la base des aéroports.</div>';let i=0;return `<div>${pts.map(p=>{const k=p.kind==='departure'?'D':p.kind==='destination'?'A':String(++i);const extra=p.kind==='waypoint'?`<input data-waypoint="${esc(p.ident)}" data-wfield="ident" value="${esc(p.ident)}" style="width:100%;border:1px solid #ccd6dd;border-radius:5px;padding:6px;font-size:11px">`:`<strong>${esc(p.ident)}</strong>`;return `<div class="route-point"><div class="point-number">${k}</div><div class="point-main">${extra}<small>${fmt(p.lat,4)}, ${fmt(p.lon,4)}</small></div>${p.kind==='waypoint'?actionButton('×',`remove-waypoint:${esc(p.ident)}`,'btn small danger'):actionButton('Zoom',`zoom-point:${p.lat},${p.lon}`,'btn small')}</div>`}).join('')}</div><div class="notice" style="margin-top:12px">Distance affichée : ${fmt(calculations().distanceNm)} NM · Cap vrai approximatif par segment disponible.</div>`}

async function fetchAviationReports(which){
 const f=flight(), field=which==='origin'?'origin':'destination', code=String(f[field]||'').trim().toUpperCase();
 if(!/^[A-Z0-9]{4}$/.test(code)){toast('Sélectionnez d’abord un aéroport OACI valide.','error');return;}
 const endpoints=API_BASE?`${API_BASE}`:'https://aviationweather.gov/api/data';
 const req=async(kind)=>{const u=new URL(`${endpoints}/${kind}`,location.origin);u.searchParams.set('ids',code);u.searchParams.set('format','json');const r=await fetch(u.toString(),{cache:'no-store'});if(!r.ok)throw new Error(`${kind.toUpperCase()} indisponible (${r.status})`);const raw=await r.text();let data;try{data=JSON.parse(raw)}catch{data=raw}if(typeof data==='string')return data.trim();if(Array.isArray(data)){if(!data.length)return '';return data.map(x=>kind==='metar'?(x.rawOb||x.raw_text||x.raw||JSON.stringify(x)):(x.rawTAF||x.rawTaf||x.raw_text||x.raw||JSON.stringify(x))).join('\n')}return data?.rawOb||data?.rawTAF||data?.raw_text||data?.raw||JSON.stringify(data)};
 try{toast(`Récupération METAR / TAF ${code}…`);const [m,t]=await Promise.allSettled([req('metar'),req('taf')]);const errors=[];if(m.status==='fulfilled'&&m.value){if(which==='origin')f.departureMetar=m.value;else f.destinationMetar=m.value;}else errors.push(m.status==='rejected'?m.reason.message:'METAR non disponible pour cet aéroport.');if(t.status==='fulfilled'&&t.value){if(which==='origin')f.departureTaf=t.value;else f.destinationTaf=t.value;}else errors.push(t.status==='rejected'?t.reason.message:'TAF non disponible pour cet aéroport.');touchFlight();saveState(true);if(currentView==='weather')renderView('weather');if(errors.length===2)toast(`Sources météo indisponibles : ${errors.join(' / ')}`,'error');else if(errors.length)toast(`Bulletin(s) récupéré(s) avec avertissement : ${errors.join(' / ')}`,'');else toast(`METAR et TAF récupérés pour ${code}.`,'success');}
 catch(e){toast(`Impossible de récupérer les bulletins : ${e.message}`,'error')}
}

e.</div>`,'Sources indépendantes et autorisées')}</div></div>`}

 % du trajet</td></tr><tr><td>Dégagement</td><td>${fmt(x.alt)} kg</td><td>Valeur entrée</td></tr><tr><td>Réserve finale</td><td>${fmt(x.reserve)} kg</td><td>${fmt(f.finalReserveMin)} min × consommation du profil</td></tr><tr><td>Supplémentaire</td><td>${fmt(x.extra)} kg</td><td>Valeur entrée</td></tr><tr><td><b>Carburant bloc calculé</b></td><td><b>${fmt(x.block)} kg</b></td><td>${f.blockFuelOverrideKg!==''?'Valeur bloc imposée':'Somme des éléments ci-dessus'}</td></tr></tbody></table></div><div class="doc-section"><h3>Masses — calcul indicatif</h3><table class="doc-table"><thead><tr><th>Paramètre</th><th>Valeur</th><th>Limite configurée</th><th>Contrôle</th></tr></thead><tbody><tr><td>ZFW estimée</td><td>${fmt(x.zfw)} kg</td><td>${fmt(x.ac.maxZfwKg)} kg</td><td>${x.zfw<=x.ac.maxZfwKg?'Dans la limite configurée':'Dépasse la limite configurée'}</td></tr><tr><td>TOW estimée</td><td>${fmt(x.tow)} kg</td><td>${fmt(x.ac.maxTowKg)} kg</td><td>${x.tow<=x.ac.maxTowKg?'Dans la limite configurée':'Dépasse la limite configurée'}</td></tr><tr><td>Masse arrivée estimée</td><td>${fmt(x.landing)} kg</td><td>${fmt(x.ac.maxLdwKg)} kg</td><td>${x.landing<=x.ac.maxLdwKg?'Dans la limite configurée':'Dépasse la limite configurée'}</td></tr></tbody></table><p class="tiny muted">Charge utile calculée avec ${fmt(f.pax)} passagers × 84 kg/personne + fret + bagages. Les limites proviennent du profil configuré, pas d'une fiche AFM/POH chargée automatiquement.</p></div><div class="doc-section"><h3>Briefing / observations consignées</h3><table class="doc-table"><tbody><tr><td><b>METAR départ (saisi)</b></td><td>${esc(f.departureMetar||'Non saisi')}</td></tr><tr><td><b>METAR destination (saisi)</b></td><td>${esc(f.destinationMetar||'Non saisi')}</td></tr><tr><td><b>NOTAM consignés</b></td><td style="white-space:pre-wrap">${esc(f.notams||'Non saisis')}</td></tr><tr><td><b>Météo / phénomènes</b></td><td style="white-space:pre-wrap">${esc(f.weatherNotes||'—')}</td></tr><tr><td><b>Terrain / obstacles</b></td><td style="white-space:pre-wrap">${esc(f.terrainNotes||'—')}</td></tr><tr><td><b>TEM / remarques</b></td><td style="white-space:pre-wrap">${esc(f.temBrief||'—')} ${f.remarks?'\n'+esc(f.remarks):''}</td></tr></tbody></table></div><div class="doc-section"><h3>Contrôles automatiques</h3>${x.checks.length?`<table class="doc-table"><thead><tr><th>Statut</th><th>Vérification</th><th>Note</th></tr></thead><tbody>${x.checks.map(c=>`<tr><td>${c.level==='bad'?'À corriger':'À compléter'}</td><td>${esc(c.title)}</td><td>${esc(c.text)}</td></tr>`).join('')}</tbody></table>`:'<p class="tiny">Aucun contrôle de formulaire en attente. Cela ne valide pas la sécurité opérationnelle du vol.</p>'}</div><div class="doc-section"><h3>Statut et limites du document</h3><div style="border:1px solid #d6e0e6;padding:12px;font-size:10px;line-height:1.6">Ce dossier est calculé à partir des valeurs saisies et des données explicitement disponibles. Le temps, la distance, le carburant et les masses sont des estimations, pas un calcul de performance certifié. Aucune procédure officielle ni donnée de navigation n'est garantie à jour par ce dossier. Vérifiez les données applicables, les cartes, les NOTAM, les bulletins météo, le manuel de vol et les calculs propres à l'appareil avant toute utilisation opérationnelle. <br><br>Généré le ${new Date().toLocaleString('fr-FR')} · FlightDeck ${VERSION} · Dossier ${esc(f.id)}</div></div></div><div class="grid cols-2 no-print" style="margin-top:15px"><div class="card"><div class="card-head"><h2>Checklist de préparation</h2></div><div class="card-body">${x.checks.length?x.checks.map(c=>`<div class="row" style="margin:7px 0"><span class="badge ${c.level==='bad'?'bad':'warn'}">${c.level==='bad'?'Action':'Info'}</span><span class="tiny">${esc(c.title)}</span></div>`).join(''):'<div class="notice good">Tous les champs testés sont renseignés.</div>'}</div></div><div class="card"><div class="card-head"><h2>Exports du dossier</h2></div><div class="card-body"><div class="grid cols-2">${actionButton('Imprimer OFP','print-ofp','btn primary')}${actionButton('Exporter JSON','export-flight','btn')}${actionButton('Exporter CSV route','export-route-csv','btn')}${actionButton('Sauvegarder toutes les données','export-backup','btn')}</div></div></div></div>`}

function bindView(view){const c=$('#content');if(view==='weather'&&API_BASE){const wf=flight();if(!wf._autoReportRequested){wf._autoReportRequested=true;setTimeout(()=>{fetchAviationReports('origin');fetchAviationReports('destination')},350);}}$$('[data-waypoint]',c).forEach(el=>el.addEventListener('change',()=>{const oldId=el.dataset.waypoint,newId=el.value.trim().toUpperCase();if(!newId){el.value=oldId;return;}const f=flight(),p=(f.routePoints||[]).find(p=>p.ident===oldId);if(p){p.ident=newId;p.name=newId;f.route=f.route.split(/\s+/).map(t=>t===oldId?newId:t).join(' ');touchFlight();renderView('route');}}));if((view==='planning'||view==='ofp')&&!airportLoaded){ensureAirports().then(()=>{if(currentView===view)renderView(view)}).catch(()=>toast('Base d’aéroports indisponible. Vous pouvez saisir les codes manuellement, mais la distance ne sera pas calculée sans coordonnées.','error'));}if(view==='route'){initMap();if(!airportLoaded)ensureAirports().then(()=>{if(currentView==='route')drawMapRoute()}).catch(()=>toast('Base d’aéroports indisponible. Chargez-la depuis Aéroports & pistes.','error'));}if(view==='airports'){const s=$('#airportSearch');if(s)s.addEventListener('keydown',e=>{if(e.key==='Enter')searchAirports()});}if(view==='charts'){const up=$('#chartUpload');if(up)up.addEventListener('change',()=>handlePdfUpload(up.files));}if(view==='checklists')$$('[data-check-group]',c).forEach(el=>el.addEventListener('change',()=>{const key=el.dataset.checkGroup+'|'+el.dataset.checkIndex;state.checklistProgress[key]=el.checked;saveState(true);renderView('checklists')}));
$$('[data-flight]',c).forEach(el=>{const event=(el.tagName==='SELECT'||el.type==='checkbox')?'change':'input';el.addEventListener(event,()=>{const f=flight(),k=el.dataset.flight;f[k]=el.type==='checkbox'?el.checked:el.value;if(k==='aircraftId'){const a=aircraft();f.cruiseKt=f.cruiseKt||a.cruiseKt}touchFlight();if(view==='planning'){const pc=$('#planningCalc');if(pc)pc.innerHTML=renderPlanningCalc();const calc=document.querySelector('#planningCalc');if(calc)calc.querySelectorAll('button').forEach(b=>{});}if(view==='weather'&&(k==='departureMetar'||k==='destinationMetar'||k==='notams'||k==='weatherNotes')){}if(view==='ofp'){const y=$('#content');renderView('ofp');}if(view==='overview'){}if(k==='origin'||k==='destination'||k==='alternate'){$$('datalist').forEach(()=>{});}refreshHeader();});});
$$('[data-setting]',c).forEach(el=>{el.addEventListener(el.tagName==='SELECT'?'change':'input',()=>{state.settings[el.dataset.setting]=el.value;saveState(true);refreshHeader()})});$$('[data-setting-bool]',c).forEach(el=>el.addEventListener('change',()=>{const key=el.dataset.settingBool;state.settings[key]=el.checked;saveState(true);if(key==='trackingEnabled'){if(el.checked){if(state.settings.trackingEndpoint)startBridge();else toast('Renseignez d’abord l’URL du connecteur.','error')}else{if(trackingTimer){clearInterval(trackingTimer);trackingTimer=null;}toast('Connexion de position désactivée.');}}}));}

async function lookupAirportField(which){const f=flight();const code=f[which];try{await ensureAirports();const a=pointForAirport(code);if(!a){toast(`Aéroport ${code} non trouvé. Vérifiez le code ou recherchez dans Aéroports & pistes.`, 'error');navTo('airports');$('#airportSearch').value=code;searchAirports();return;}toast(`${a.ident} · ${a.name}`,'success');if(currentView==='planning')renderView('planning');}catch(e){toast(`Impossible de charger la base : ${e.message}`,'error')}}
async function searchAirports(){const status=$('#airportResultStatus'),tbody=$('#airportResults');if(!tbody)return;const q=($('#airportSearch')?.value||'').trim().toLowerCase(),type=$('#airportType')?.value||'';if(!airportLoaded){status.textContent='Chargement de la base mondiale…';tbody.innerHTML='<tr><td colspan="7">Chargement des données…</td></tr>';try{await ensureAirports()}catch(e){status.textContent='Chargement impossible. Vérifiez la connexion.';tbody.innerHTML=`<tr><td colspan="7">${esc(e.message)}</td></tr>`;return;}}let list=airportRows;if(type)list=list.filter(a=>a.type===type);if(q)list=list.filter(a=>[a.ident,a.gps_code,a.local_code,a.name,a.municipality,a.iso_country,a.iso_region].some(v=>String(v||'').toLowerCase().includes(q)));list=list.slice(0,100);airportSearchResults=list;status.textContent=`${list.length} résultat(s) affiché(s)${q?' pour « '+q+' »':''}.`;tbody.innerHTML=list.length?list.map(a=>`<tr><td class="mono"><strong>${esc(a.ident)}</strong>${a.gps_code&&a.gps_code!==a.ident?`<div class="tiny muted">${esc(a.gps_code)}</div>`:''}</td><td><strong>${esc(a.name)}</strong></td><td>${esc(a.municipality||'—')}<div class="tiny muted">${esc(a.iso_region||'')}</div></td><td>${esc(a.iso_country||'—')}</td><td>${fmt(a.elevation_ft)} ft</td><td>${esc(a.type||'—')}</td><td><div class="table-action"><button class="btn small" data-action="use-origin:${esc(a.ident)}">Départ</button><button class="btn small" data-action="use-destination:${esc(a.ident)}">Arrivée</button><button class="btn small primary" data-action="airport-details:${esc(a.ident)}">Détails</button></div></td></tr>`).join(''):`<tr><td colspan="7" class="muted">Aucun résultat.</td></tr>`;}
async function showAirportDetails(code){if(!airportLoaded)await ensureAirports();const a=airportRows.find(x=>x.ident===code)||airportRows.find(x=>x.gps_code===code);if(!a){toast('Aéroport non trouvé.','error');return;}currentAirport=a;const host=$('#airportDetail');if(!host)return;host.innerHTML=`<section class="card"><div class="card-head"><div><h2>${esc(a.name)}</h2><p>${esc(a.ident)} · ${esc(a.municipality||'')} · ${esc(a.iso_country||'')}</p></div><div class="actions"><button class="btn small" data-action="use-origin:${esc(a.ident)}">Choisir départ</button><button class="btn small" data-action="use-destination:${esc(a.ident)}">Choisir arrivée</button><button class="btn small primary" data-action="use-alternate:${esc(a.ident)}">Choisir dégagement</button></div></div><div class="card-body"><div class="grid cols-4">${stat('Altitude',`${fmt(a.elevation_ft)} ft`,'Altitude rapportée par la base')}${stat('Type',esc(a.type||'—'),'Catégorie de l’aéroport')}${stat('Latitude',fmt(a.latitude_deg,5),'WGS84')}${stat('Longitude',fmt(a.longitude_deg,5),'WGS84')}</div><div class="grid cols-2" style="margin-top:15px"><div><h3 class="section-title" style="margin-bottom:8px">Pistes dans la base ouverte</h3><div id="runwayList" class="tiny muted">Chargement…</div></div><div><h3 class="section-title" style="margin-bottom:8px">Fréquences dans la base ouverte</h3><div id="freqList" class="tiny muted">Chargement…</div></div></div><div class="notice warn" style="margin-top:13px">Ces données ne sont pas une publication AIP certifiée. Les longueurs, surfaces, disponibilités et fréquences doivent être confirmées par la publication en vigueur de l'État concerné.</div></div></section>`;try{const [rs,fs]=await Promise.all([ensureRunways(),ensureFrequencies()]);const rr=rs.filter(r=>r.airport_ident===a.ident);const ff=fs.filter(r=>r.airport_ident===a.ident);$('#runwayList').innerHTML=rr.length?`<div class="table-wrap"><table><thead><tr><th>Désignation</th><th>Longueur</th><th>Largeur</th><th>Surface</th></tr></thead><tbody>${rr.map(r=>`<tr><td>${esc(r.le_ident||'?')} / ${esc(r.he_ident||'?')}</td><td>${fmt(r.length_ft)} ft</td><td>${fmt(r.width_ft)} ft</td><td>${esc(r.surface||'—')}</td></tr>`).join('')}</tbody></table></div>`:'Aucune piste listée dans la source.';$('#freqList').innerHTML=ff.length?`<div class="table-wrap"><table><thead><tr><th>Type</th><th>Fréquence (MHz)</th><th>Nom</th></tr></thead><tbody>${ff.map(r=>`<tr><td>${esc(r.type||'—')}</td><td>${esc(r.frequency_mhz||'—')}</td><td>${esc(r.description||'—')}</td></tr>`).join('')}</tbody></table></div>`:'Aucune fréquence listée dans la source.';}catch(e){$('#runwayList').textContent='Données de pistes indisponibles.';$('#freqList').textContent='Données de fréquences indisponibles.';}}
function initMap(){if(!window.L){toast('La bibliothèque cartographique n’a pas pu se charger. Vérifiez la connexion Internet.','error');return;}const el=$('#mainMap');if(!el)return;routeLine=null;waypointLayer=null;airportLayer=null;trackingMarker=null;mapInstance=L.map(el,{zoomControl:true,preferCanvas:true}).setView([43.6,3.9],6);const layers={street:L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}),topo:L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenTopoMap, © OpenStreetMap contributors'}),satellite:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Tiles © Esri'} )};let active=layers[state.settings.defaultMapLayer]||layers.street;active.addTo(mapInstance);const sel=$('#mapLayer');if(sel){sel.addEventListener('change',()=>{Object.values(layers).forEach(l=>{if(mapInstance.hasLayer(l))mapInstance.removeLayer(l)});layers[sel.value].addTo(mapInstance);state.settings.defaultMapLayer=sel.value;saveState(true);});}waypointLayer=L.layerGroup().addTo(mapInstance);airportLayer=L.layerGroup().addTo(mapInstance);drawMapRoute();mapInstance.on('click',e=>{if(!mapClickMode)return;const f=flight(),ident=`WPT${String((f.routePoints||[]).length+1).padStart(2,'0')}`;f.routePoints=f.routePoints||[];f.routePoints.push({ident,lat:Number(e.latlng.lat.toFixed(6)),lon:Number(e.latlng.lng.toFixed(6)),name:ident});f.route+=(f.route?' ':'')+ident;mapClickMode=false;touchFlight();toast(`Point ${ident} ajouté à la route.`,'success');renderView('route');});setTimeout(()=>mapInstance?.invalidateSize(),100);}
function drawMapRoute(){if(!mapInstance)return;waypointLayer?.clearLayers();airportLayer?.clearLayers();const f=flight(),pts=routeCoordinates(f);const coords=pts.map(p=>[p.lat,p.lon]);if(routeLine)try{mapInstance.removeLayer(routeLine)}catch{}if(coords.length>1){routeLine=L.polyline(coords,{color:'#13a39d',weight:3,opacity:.9,dashArray:'8 7'}).addTo(mapInstance);}pts.forEach((p,i)=>{const colour=p.kind==='departure'?'#16896e':p.kind==='destination'?'#c24d55':'#168f9a';L.circleMarker([p.lat,p.lon],{radius:p.kind==='waypoint'?5:7,color:'#fff',weight:2,fillColor:colour,fillOpacity:1}).bindPopup(`<strong>${esc(p.ident)}</strong><br>${esc(p.name||'')}<br>${fmt(p.lat,5)}, ${fmt(p.lon,5)}`).addTo(p.kind==='waypoint'?waypointLayer:airportLayer);});if(coords.length>1){try{mapInstance.fitBounds(coords,{padding:[35,35],maxZoom:8})}catch{}}else if(coords.length===1)mapInstance.setView(coords[0],8);const list=$('#routePointList');if(list)list.innerHTML=renderRoutePoints();}

async function fetchWeather(which){const f=flight(),code=which==='origin'?'origin':'destination';try{if(!airportLoaded)await ensureAirports();const a=pointForAirport(f[code]);if(!a)throw new Error(`Aéroport ${f[code]} non reconnu`);const url=new URL(WEATHER_URL,location.origin);url.searchParams.set('latitude',a.lat);url.searchParams.set('longitude',a.lon);url.searchParams.set('current','temperature_2m,relative_humidity_2m,dew_point_2m,apparent_temperature,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_gusts_10m');url.searchParams.set('hourly','visibility');url.searchParams.set('forecast_days','1');url.searchParams.set('timezone','UTC');const r=await fetch(url);if(!r.ok)throw new Error(`Météo indisponible (${r.status})`);const j=await r.json(),c=j.current||{};const vi=(j.hourly?.time||[]).findIndex(t=>t===c.time);const vis=vi>=0?j.hourly?.visibility?.[vi]:undefined;const desc=weatherDesc(c.weather_code);const record={temperature:c.temperature_2m,humidity:c.relative_humidity_2m,dew:c.dew_point_2m,wind:c.wind_speed_10m,gust:c.wind_gusts_10m,pressure:c.pressure_msl,precip:c.precipitation,cloud:c.cloud_cover,visibility:vis,time:c.time?new Date(c.time+'Z').toLocaleString('fr-FR',{timeZone:'UTC'})+' UTC':'—',description:desc,location:`${a.ident} · ${a.municipality||a.name}`,lat:a.lat,lon:a.lon};state.lastWeather=state.lastWeather||{};state.lastWeather[which]=record;saveState(true);const host=$('#weather'+(which==='origin'?'Origin':'Destination'));if(host)host.innerHTML=renderWeatherBlock(record);toast(`Prévision chargée pour ${a.ident}.`,'success');}catch(e){toast(`Météo non disponible : ${e.message}`,'error')}}
function weatherDesc(code){const map={0:'Ciel dégagé',1:'Principalement dégagé',2:'Partiellement nuageux',3:'Couvert',45:'Brouillard',48:'Brouillard givrant',51:'Bruine légère',53:'Bruine modérée',55:'Bruine dense',61:'Pluie faible',63:'Pluie modérée',65:'Pluie forte',71:'Neige faible',73:'Neige modérée',75:'Neige forte',80:'Averses faibles',81:'Averses modérées',82:'Averses violentes',95:'Orage',96:'Orage avec grêle faible',99:'Orage avec grêle forte'};return map[code]||'Conditions atmosphériques'}
function getByPath(obj,path){return path.split('.').reduce((v,k)=>v==null?undefined:v[k],obj)}
function firstVal(obj,paths,def=''){for(const p of paths){const v=getByPath(obj,p);if(v!==undefined&&v!==null&&v!=='')return v;}return def;}
function applyImportedOFP(d){const f=flight();const pick=(paths,def='')=>firstVal(d,paths,def);const origin=pick(['flight.origin','origin.icao_code','origin.icao','origin.ident','departure.icao','departure.icao_code','departure.ident']);const dest=pick(['flight.destination','destination.icao_code','destination.icao','destination.ident','arrival.icao','arrival.icao_code','arrival.ident']);const alts=pick(['flight.alternate','alternate.icao_code','alternate.icao','alternate.ident','alternateAirport']);if(origin)f.origin=String(origin).toUpperCase();if(dest)f.destination=String(dest).toUpperCase();if(alts)f.alternate=String(alts).toUpperCase();const call=pick(['flight.callsign','callsign','atc.callsign','flightNumber']);if(call)f.callsign=String(call);const flightNo=pick(['flight.flightNo','flightNo','flight_number']);if(flightNo)f.flightNo=String(flightNo);const air=pick(['aircraft.icao','aircraft.icao_code','aircraft.icaocode','flight.aircraftIcao']);if(air){const match=state.aircraft.find(a=>a.icao===String(air).toUpperCase());if(match)f.aircraftId=match.id;}const route=pick(['flight.route','route','general.route','route_string']);if(route)f.route=String(route);const fl=pick(['flight.cruiseLevel','cruiseLevel','general.initial_altitude','cruise_altitude','flightLevel']);if(fl){const n=Number(String(fl).replace(/^FL/i,''));f.cruiseLevel=String(Number.isFinite(n)&&n>1000?Math.round(n/100):n||fl).replace(/^FL/i,'');}const dt=pick(['flight.date','date','times.sched_out','departureTime']);if(dt){const dte=new Date(isNaN(Number(dt))?dt:Number(dt)*1000);if(!Number.isNaN(dte.getTime()))f.date=new Date(dte.getTime()-dte.getTimezoneOffset()*60000).toISOString().slice(0,16);}const unit=String(pick(['units','params.units','fuel.units','weights.units'],'')).toLowerCase();const toKg=v=>{if(v===''||!Number.isFinite(Number(v)))return null;if(unit.includes('lb'))return Number(v)*0.45359237;if(unit.includes('kg')||unit.includes('metric'))return Number(v);return null;};const fuel=pick(['fuel.block','fuel.blockFuel','fuel.block_fuel','blockFuelKg']);const fuelKg=toKg(fuel);if(fuelKg!==null)f.blockFuelOverrideKg=String(Math.round(fuelKg));const trip=pick(['fuel.trip','fuel.tripFuel','fuel.trip_fuel','tripFuelKg']);const tripKg=toKg(trip);if(tripKg!==null)f.tripFuelOverrideKg=String(Math.round(tripKg));const sid=pick(['flight.sid','sid']);const star=pick(['flight.star','star']);const approach=pick(['flight.approach','approach']);if(sid)f.sid=String(sid);if(star)f.star=String(star);if(approach)f.approach=String(approach);f.importedFileAt=nowISO();f.importSummary={origin,destination:dest,alternate:alts,aircraft:air,route};touchFlight();}
async function handleImportFile(file){if(!file)return;const text=await file.text();try{if(file.name.toLowerCase().endsWith('.xml')||text.trim().startsWith('<')){const doc=new DOMParser().parseFromString(text,'text/xml');if(doc.querySelector('parsererror'))throw new Error('XML invalide');const read=(sel)=>doc.querySelector(sel)?.textContent?.trim()||'';const out={origin:{icao_code:read('origin icao_code')||read('origin icao')||read('departure')},destination:{icao_code:read('destination icao_code')||read('destination icao')||read('arrival')},alternate:{icao_code:read('alternate icao_code')||read('alternate icao')},general:{route:read('general route')||read('route'),initial_altitude:read('general initial_altitude')},atc:{callsign:read('atc callsign')||read('callsign')},fuel:{block:read('fuel block')||read('fuel block_fuel'),trip:read('fuel trip')||read('fuel trip_fuel')},units:read('units')||read('params units')};applyImportedOFP(out);}else{const data=JSON.parse(text);if(data.version&&data.flights){state={...defaultState(),...data};saveState(true);toast('Sauvegarde FlightDeck restaurée.','success');navTo('overview');return;}applyImportedOFP(data.flight||data);}saveState(true);toast('Fichier importé. Vérifiez les champs remplis et les paramètres avant de les utiliser.','success');navTo('planning')}catch(e){if(file.name.toLowerCase().endsWith('.pdf')){toast('PDF reçu : ajout à la bibliothèque documentaire.');navTo('charts');const input=$('#chartUpload');if(input){const dt=new DataTransfer();dt.items.add(file);input.files=dt.files;handlePdfUpload(input.files);}return;}toast(`Import impossible : ${e.message}`,'error')}}
function openModal(title,body){$('#modalHost').innerHTML=`<div class="modal-backdrop" data-action="backdrop-close"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><strong style="font-size:13px;flex:1">${esc(title)}</strong><button class="icon-btn" data-action="close-modal" aria-label="Fermer">×</button></div><div class="modal-body">${body}</div></div></div>`;}
function closeModal(){if(activePdfUrl){URL.revokeObjectURL(activePdfUrl);activePdfUrl=null;}$('#modalHost').innerHTML='';}
async function handlePdfUpload(files){if(!files||!files.length)return;for(const file of files){if(file.type!=='application/pdf'&&!file.name.toLowerCase().endsWith('.pdf')){toast(`${file.name} n'est pas un PDF.`,'error');continue;}if(file.size>200*1024*1024){toast(`${file.name} dépasse 200 Mo.`,'error');continue;}try{const id=uid();await idbPut('pdf:'+id,{blob:file,name:file.name,size:file.size,type:file.type,addedAt:nowISO()});state.documents.unshift({id,name:file.name,size:file.size,addedAt:nowISO(),airport:flight().origin});saveState(true);toast(`${file.name} ajouté à la bibliothèque.`,'success');}catch(e){toast(`Stockage PDF impossible : ${e.message}`,'error');}}if(currentView==='charts')renderView('charts')}
async function viewDocument(id){const rec=await idbGet('pdf:'+id);if(!rec||!rec.blob){toast('Le PDF est introuvable dans le stockage local.','error');return;}activePdfUrl=URL.createObjectURL(rec.blob);openModal(rec.name,`<div class="chart-viewer"><iframe title="${esc(rec.name)}" src="${activePdfUrl}"></iframe></div><div class="tiny muted" style="margin-top:8px">Fichier conservé dans le stockage local de ce navigateur. Les documents ne sont pas synchronisés vers un serveur.</div>`)}
function viewLink(id){const d=state.savedLinks.find(x=>x.id===id);if(!d)return;const allowed=d.url.startsWith('https://');if(!allowed){toast('Seules les URL HTTPS sont autorisées.','error');return;}openModal(d.title,`<div class="notice">Source : ${esc(d.url)}. Certains sites empêchent l’affichage intégré pour des raisons de sécurité. Si le panneau reste vide, le fournisseur n’autorise pas son intégration.</div><div class="chart-viewer" style="margin-top:10px"><iframe title="${esc(d.title)}" src="${esc(d.url)}" referrerpolicy="strict-origin-when-cross-origin" loading="lazy"></iframe></div><p class="tiny muted">L'affichage dans ce panneau dépend des règles du fournisseur. La source n'est ni téléchargée ni copiée dans l'application.</p><div class="row"><a class="btn" href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">Ouvrir la source dans un nouvel onglet</a></div>`)}
function genDocumentText(){const f=flight(),x=calculations();return `FLIGHTDECK — OPERATIONAL FLIGHT PLAN\nFlight: ${f.callsign} / ${f.flightNo}\nDate: ${f.date}\nDeparture: ${f.origin} ${airportName(f.origin)}\nDestination: ${f.destination} ${airportName(f.destination)}\nAlternate: ${f.alternate}\nDeparture METAR: ${f.departureMetar||'not recorded'}\nDeparture TAF: ${f.departureTaf||'not recorded'}\nDestination METAR: ${f.destinationMetar||'not recorded'}\nDestination TAF: ${f.destinationTaf||'not recorded'}\nNOTAM notes: ${f.notams||'not recorded'}\nAircraft: ${x.ac.name} ${x.ac.icao} ${x.ac.registration}\nRules / cruise: ${f.rules} / FL${f.cruiseLevel}\nRoute: ${f.route}\nSID: ${f.sid}; STAR: ${f.star}; Approach: ${f.approach}\nDistance estimate: ${x.distanceNm.toFixed(1)} NM\nTime estimate: ${x.estimatedMin.toFixed(0)} min\nTrip fuel estimate: ${x.tripFuel.toFixed(0)} kg\nBlock fuel estimate: ${x.block.toFixed(0)} kg\nEstimated ZFW / TOW / landing: ${x.zfw.toFixed(0)} / ${x.tow.toFixed(0)} / ${x.landing.toFixed(0)} kg\n\nLIMITATIONS: Estimations based on entered values; no certified performance calculation. Verify all operational data and documents in applicable official sources.\nGenerated: ${new Date().toISOString()}\n`}
function download(name,content,type='text/plain;charset=utf-8'){const blob=content instanceof Blob?content:new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportFlight(){const f=flight();download(`FlightDeck_${f.origin}_${f.destination}_${f.flightNo||f.id}.json`,JSON.stringify({flight:f,aircraft:aircraft(),calculations:calculations(),generatedAt:nowISO()},null,2),'application/json')}
function exportBackup(){saveState(true);download(`FlightDeck_backup_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(state,null,2),'application/json')}
function exportRouteCsv(){const x=calculations();const rows=[['Seq','Ident','Latitude','Longitude','Leg NM','Bearing true'],...x.points.map((p,i)=>{const l=i?x.legs[i-1]:null;return[i+1,p.ident,p.lat,p.lon,l?.distance.toFixed(2)||'',l?.bearing.toFixed(0)||'']} )];const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');download(`FlightDeck_route_${flight().origin}_${flight().destination}.csv`,'\ufeff'+csv,'text/csv;charset=utf-8')}
function newFlight(){const f=defaultFlight();state.flights.unshift(f);state.activeFlightId=f.id;saveState(true);navTo('planning');toast('Nouvelle fiche de vol créée.','success')}
function loadFlight(id){const f=state.flights.find(x=>x.id===id);if(!f)return;state.activeFlightId=id;saveState(true);navTo('overview');toast('Fiche de vol chargée.','success')}
function useAirport(code,field){flight()[field]=code;touchFlight();toast(`${code} affecté au champ ${field}.`,'success');if(currentView==='airports'){const q=$('#airportSearch')?.value||'',t=$('#airportType')?.value||'';renderView('airports');if($('#airportSearch'))$('#airportSearch').value=q;if($('#airportType'))$('#airportType').value=t;searchAirports();}else renderView(currentView);}
function addChecklistItem(){const group=$('#checkGroup')?.value,newGroup=$('#newCheckGroup')?.value.trim(),item=$('#newCheckItem')?.value.trim();if(!item){toast('Saisissez un libellé.','error');return;}const g=newGroup||group;if(!g){toast('Choisissez ou saisissez une section.','error');return;}if(!state.checklists[g])state.checklists[g]=[];state.checklists[g].push(item);saveState(true);renderView('checklists');toast('Élément ajouté.','success')}
function addAircraft(){openModal('Ajouter un appareil',`<div class="field-grid cols-2"><div class="field"><label>Nom appareil</label><input id="acName" placeholder="Airbus A320"></div><div class="field"><label>Code ICAO</label><input id="acIcao" placeholder="A320"></div><div class="field"><label>Immatriculation</label><input id="acReg" placeholder="F-XXXX"></div><div class="field"><label>Vitesse croisière (kt)</label><input id="acSpeed" type="number" value="450"></div><div class="field"><label>Consommation moyenne (kg/h)</label><input id="acBurn" type="number" value="2500"></div><div class="field"><label>Masse à vide (kg)</label><input id="acEmpty" type="number" value="42000"></div><div class="field"><label>ZFW max configurée (kg)</label><input id="acZfw" type="number" value="62000"></div><div class="field"><label>TOW max configurée (kg)</label><input id="acTow" type="number" value="79000"></div><div class="field"><label>LDW max configurée (kg)</label><input id="acLdw" type="number" value="66000"></div><div class="field"><label>Capacité carburant (kg)</label><input id="acFuel" type="number" value="18000"></div><div class="field"><label>Capacité passagers</label><input id="acPax" type="number" value="180"></div></div><div class="field" style="margin-top:12px"><label>Notes</label><textarea id="acNotes">Valeurs initiales à vérifier selon la configuration utilisée.</textarea></div><div class="row" style="margin-top:14px"><button class="btn primary" data-action="save-new-aircraft">Enregistrer le profil</button></div>`)}
function editAircraft(id){const a=state.aircraft.find(x=>x.id===id);if(!a)return;openModal('Modifier le profil appareil',`<div class="field-grid cols-2">${[['name','Nom appareil','text'],['icao','Code ICAO','text'],['registration','Immatriculation','text'],['cruiseKt','Vitesse croisière (kt)','number'],['burnKgHr','Consommation (kg/h)','number'],['emptyKg','Masse à vide (kg)','number'],['maxZfwKg','ZFW max (kg)','number'],['maxTowKg','TOW max (kg)','number'],['maxLdwKg','LDW max (kg)','number'],['fuelCapacityKg','Capacité carburant (kg)','number'],['paxCapacity','Capacité passagers','number']].map(([key,label,type])=>`<div class="field"><label>${label}</label><input data-edit-ac="${key}" type="${type}" value="${esc(a[key]??'')}"></div>`).join('')}</div><div class="field" style="margin-top:10px"><label>Notes</label><textarea data-edit-ac="notes">${esc(a.notes||'')}</textarea></div><div class="row" style="margin-top:14px"><button class="btn primary" data-action="save-aircraft:${a.id}">Enregistrer</button></div>`)}
async function testTracking(){const url=state.settings.trackingEndpoint;if(!url){toast('Renseignez une URL de connecteur dans Configuration.','error');return;}try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();const lat=num(d.lat??d.latitude,NaN),lon=num(d.lon??d.longitude,NaN);if(!Number.isFinite(lat)||!Number.isFinite(lon))throw new Error('Le JSON doit inclure lat et lon numériques.');toast(`Connecteur joignable : ${lat.toFixed(4)}, ${lon.toFixed(4)}`,'success')}catch(e){toast(`Connecteur inaccessible : ${e.message}. Vérifiez le service local et le CORS.`,'error')}}
function startBridge(){if(!state.settings.trackingEndpoint){toast('Configurez d’abord le connecteur dans Configuration.','error');navTo('settings');return;}if(trackingTimer)clearInterval(trackingTimer);const poll=async()=>{try{const r=await fetch(state.settings.trackingEndpoint,{cache:'no-store'});if(!r.ok)return;const d=await r.json();const lat=num(d.lat??d.latitude,NaN),lon=num(d.lon??d.longitude,NaN);if(Number.isFinite(lat)&&Number.isFinite(lon)){updateLiveValues({lat,lon,altitude:num(d.altitude_ft??d.altitude,NaN),speed:num(d.ground_speed_kt??d.speed,NaN),heading:num(d.heading_deg??d.heading,NaN)});if(mapInstance){if(!trackingMarker)trackingMarker=L.circleMarker([lat,lon],{radius:8,color:'#fff',weight:2,fillColor:'#2358cb',fillOpacity:1}).addTo(mapInstance);else trackingMarker.setLatLng([lat,lon]);}}}catch{}};poll();trackingTimer=setInterval(poll,2000);toast('Suivi du connecteur démarré.','success');}
function updateLiveValues(v){const set=(id,val)=>{const el=$('#'+id);if(el)el.value=val};set('liveLat',Number.isFinite(v.lat)?v.lat.toFixed(6):'—');set('liveLon',Number.isFinite(v.lon)?v.lon.toFixed(6):'—');set('liveAlt',Number.isFinite(v.altitude)?`${fmt(v.altitude)} ft`:'—');set('liveSpeed',Number.isFinite(v.speed)?`${fmt(v.speed)} kt`:'—');const st=$('#mapPositionStatus');if(st)st.textContent=`${v.lat.toFixed(4)}, ${v.lon.toFixed(4)}${Number.isFinite(v.speed)?` · ${fmt(v.speed)} kt`:''}`;}
function startGPS(){if(!navigator.geolocation){toast('La géolocalisation n’est pas prise en charge sur cet appareil.','error');return;}if(gpsWatchId!==null){toast('Le suivi GPS est déjà actif.');return;}gpsWatchId=navigator.geolocation.watchPosition(pos=>{const c=pos.coords;const v={lat:c.latitude,lon:c.longitude,altitude:Number.isFinite(c.altitude)?c.altitude*3.28084:NaN,speed:Number.isFinite(c.speed)?c.speed*1.94384:NaN,heading:num(c.heading,NaN)};updateLiveValues(v);if(mapInstance){if(!trackingMarker)trackingMarker=L.circleMarker([v.lat,v.lon],{radius:8,color:'#fff',weight:2,fillColor:'#2358cb',fillOpacity:1}).addTo(mapInstance).bindPopup('Position GPS de cet appareil');else trackingMarker.setLatLng([v.lat,v.lon]);}},e=>toast(`GPS indisponible : ${e.message}`,'error'),{enableHighAccuracy:true,maximumAge:1500,timeout:15000});toast('Suivi GPS activé pour cet appareil.','success')}
function stopGPS(){if(gpsWatchId!==null){navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null;}if(trackingTimer){clearInterval(trackingTimer);trackingTimer=null;}toast('Suivi arrêté.');}
async function officialSource(url,title){openModal(title,`<div class="notice">Source externe. Certains sites empêchent l'affichage intégré ; si le panneau est bloqué, utilisez le bouton d’ouverture directe ci-dessous.</div><div class="chart-viewer" style="margin-top:10px"><iframe src="${esc(url)}" title="${esc(title)}" referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div class="row" style="margin-top:10px"><a class="btn" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Ouvrir la source dans un nouvel onglet</a></div>`)}
function handleAction(action){if(action.startsWith('view:')){navTo(action.split(':')[1]);return;}if(action==='new-flight')return newFlight();if(action==='go-ofp')return navTo('ofp');if(action==='save-now'){saveState(false);return;}if(action==='import-ofp'){const inp=$('#hiddenImport');inp.value='';inp.accept='.json,.xml,application/json,text/xml';inp.onchange=()=>handleImportFile(inp.files?.[0]);inp.click();return;}if(action==='import-backup'){const inp=$('#hiddenImport');inp.value='';inp.accept='.json,application/json';inp.onchange=async()=>{const f=inp.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.version||!d.flights)throw new Error('Fichier FlightDeck invalide');state={...defaultState(),...d};saveState(true);refreshHeader();navTo('overview');toast('Sauvegarde restaurée.','success')}catch(e){toast(`Import impossible : ${e.message}`,'error')}};inp.click();return;}if(action==='export-backup')return exportBackup();if(action==='export-flight')return exportFlight();if(action==='export-route-csv')return exportRouteCsv();if(action==='print-ofp'){navTo('ofp');setTimeout(()=>window.print(),250);return;}if(action==='load-airports'){ensureAirports(true).then(()=>{toast(`${airportRows.length.toLocaleString('fr-FR')} aéroports chargés.`,'success');searchAirports()}).catch(e=>toast(e.message,'error'));return;}if(action==='search-airports')return searchAirports();if(action==='lookup-origin')return lookupAirportField('origin');if(action==='lookup-destination')return lookupAirportField('destination');if(action==='lookup-alternate')return lookupAirportField('alternate');if(action==='weather-origin')return fetchWeather('origin');if(action==='weather-destination')return fetchWeather('destination');if(action==='open-official-briefing')return officialSource('https://sofia-briefing.aviation-civile.gouv.fr/sofia/pages/homepage.html','SOFIA-Briefing — DGAC');if(action==='open-faa-charts')return officialSource('https://www.faa.gov/air_traffic/flight_info/aeronav/digital_products/dtpp/search/','FAA d-TPP — Terminal Procedures (États-Unis)');if(action==='open-eaip-france')return officialSource('https://www.sia.aviation-civile.gouv.fr/produits-numeriques-en-libre-disposition/eaip.html','eAIP France — SIA');if(action==='open-sofia')return officialSource('https://sofia-briefing.aviation-civile.gouv.fr/sofia/pages/homepage.html','SOFIA-Briefing — DGAC');if(action==='open-weather-source')return officialSource('https://aviationweather.gov/data/metar/','METAR — Aviation Weather Center');if(action==='aviation-report-origin')return fetchAviationReports('origin');if(action==='aviation-report-destination')return fetchAviationReports('destination');if(action==='toggle-waypoint')return toggleWaypoints();if(action==='fit-route'){if(mapInstance)drawMapRoute();else navTo('route');return;}if(action==='start-gps')return startGPS();if(action==='stop-gps')return stopGPS();if(action==='start-bridge')return startBridge();if(action==='test-tracking')return testTracking();if(action==='clear-waypoints'){const f=flight();f.routePoints=[];touchFlight();if(currentView==='route')renderView('route');return;}if(action.startsWith('remove-waypoint:')){const ident=action.split(':')[1];const f=flight();f.routePoints=(f.routePoints||[]).filter(p=>p.ident!==ident);touchFlight();renderView('route');return;}if(action.startsWith('zoom-point:')){if(mapInstance){const [lat,lon]=action.split(':')[1].split(',').map(Number);mapInstance.setView([lat,lon],10)}return;}if(action.startsWith('use-origin:'))return useAirport(action.slice(11),'origin');if(action.startsWith('use-destination:'))return useAirport(action.slice(16),'destination');if(action.startsWith('use-alternate:'))return useAirport(action.slice(14),'alternate');if(action.startsWith('airport-details:'))return showAirportDetails(action.slice(16));if(action.startsWith('load-flight:'))return loadFlight(action.slice(12));if(action.startsWith('view-document:'))return viewDocument(action.slice(14));if(action.startsWith('delete-document:')){const id=action.slice(16);state.documents=state.documents.filter(d=>d.id!==id);idbDelete('pdf:'+id);saveState(true);renderView('charts');toast('Document supprimé.');return;}if(action.startsWith('view-link:'))return viewLink(action.slice(10));if(action.startsWith('delete-link:')){state.savedLinks=state.savedLinks.filter(d=>d.id!==action.slice(12));saveState(true);renderView('charts');return;}if(action==='add-chart-link'){const title=$('#linkTitle')?.value.trim(),url=$('#linkUrl')?.value.trim(),airport=$('#linkAirport')?.value.trim().toUpperCase(),type=$('#linkType')?.value;if(!title||!url||!url.startsWith('https://')){toast('Saisissez un titre et une URL HTTPS.','error');return;}state.savedLinks.unshift({id:uid(),title,url,airport,type,addedAt:nowISO()});saveState(true);renderView('charts');toast('Source ajoutée à la bibliothèque.','success');return;}if(action==='add-check-item')return addChecklistItem();if(action==='reset-checklists'){state.checklistProgress={};saveState(true);renderView('checklists');toast('Progression des checklists réinitialisée.');return;}if(action.startsWith('remove-check:')){const parts=action.split(':'),g=decodeURIComponent(parts[1]),i=Number(parts[2]);state.checklists[g]?.splice(i,1);const prog={};Object.entries(state.checklistProgress).forEach(([k,v])=>{const [gg,ii]=k.split('|');if(gg!==g)prog[k]=v;else if(Number(ii)<i)prog[k]=v;else if(Number(ii)>i)prog[gg+'|'+(Number(ii)-1)]=v});state.checklistProgress=prog;saveState(true);renderView('checklists');return;}if(action.startsWith('remove-check-group:')){const g=decodeURIComponent(action.slice(19));delete state.checklists[g];Object.keys(state.checklistProgress).forEach(k=>{if(k.startsWith(g+'|'))delete state.checklistProgress[k]});saveState(true);renderView('checklists');return;}if(action==='add-aircraft')return addAircraft();if(action.startsWith('edit-aircraft:'))return editAircraft(action.slice(14));if(action.startsWith('select-aircraft:')){flight().aircraftId=action.slice(16);flight().cruiseKt=aircraft().cruiseKt;touchFlight();navTo('planning');return;}if(action.startsWith('delete-aircraft:')){const id=action.slice(16);if(state.aircraft.length<=1){toast('Conservez au moins un profil.','error');return;}state.aircraft=state.aircraft.filter(a=>a.id!==id);if(flight().aircraftId===id)flight().aircraftId=state.aircraft[0].id;saveState(true);renderView('fleet');return;}if(action==='save-new-aircraft'){const name=$('#acName')?.value.trim(),icao=$('#acIcao')?.value.trim().toUpperCase();if(!name||!icao){toast('Nom et code ICAO requis.','error');return;}const a={id:uid(),name,icao,registration:$('#acReg').value,cruiseKt:num($('#acSpeed').value,450),burnKgHr:num($('#acBurn').value,2500),emptyKg:num($('#acEmpty').value),maxZfwKg:num($('#acZfw').value),maxTowKg:num($('#acTow').value),maxLdwKg:num($('#acLdw').value),fuelCapacityKg:num($('#acFuel').value),paxCapacity:num($('#acPax').value),notes:$('#acNotes').value};state.aircraft.push(a);saveState(true);closeModal();renderView('fleet');toast('Profil appareil ajouté.','success');return;}if(action.startsWith('save-aircraft:')){const id=action.slice(14),a=state.aircraft.find(x=>x.id===id);if(!a)return;$$('[data-edit-ac]').forEach(el=>{const k=el.dataset.editAc;a[k]=el.type==='number'?num(el.value):el.value});saveState(true);closeModal();renderView('fleet');toast('Profil enregistré.','success');return;}if(action==='reset-all-data'){openModal('Effacer les données locales',`<div class="notice bad">Cette action supprimera les vols, profils, checklists et paramètres enregistrés sur cet appareil. Les PDF seront également supprimés.</div><div class="row" style="margin-top:15px"><button class="btn danger" data-action="confirm-reset-all">Effacer définitivement</button><button class="btn" data-action="close-modal">Annuler</button></div>`);return;}if(action==='confirm-reset-all'){state=defaultState();localStorage.removeItem('flightdeck_state_v2');indexedDB.deleteDatabase(DB_NAME);closeModal();if(gpsWatchId!==null)stopGPS();navTo('overview');refreshHeader();toast('Données locales effacées.');return;}if(action==='close-modal'){closeModal();return;}}
